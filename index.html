<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gram Altın (GAU/TRY) Canlı Takip</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; padding: 12px; min-height: 100vh; }
        .container { width: 100%; max-width: 550px; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); margin-bottom: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        h1 { font-size: 17px; color: #f0b429; font-weight: 600; }
        .badge { background-color: #238636; color: white; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .box { background-color: #21262d; border: 1px solid #30363d; border-radius: 10px; padding: 12px; text-align: center; }
        .box span { display: block; font-size: 11px; color: #8b949e; margin-bottom: 4px; }
        .box strong { font-size: 19px; color: #ffffff; letter-spacing: 0.5px; }
        .footer { display: flex; justify-content: space-between; font-size: 11px; color: #8b949e; border-top: 1px solid #30363d; padding-top: 10px; }
        
        /* Grafik Konteynerı */
        .chart-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 14px; overflow: hidden; padding: 10px; height: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .tradingview-widget-container { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Fiyat Kartı -->
        <div class="card">
            <div class="header">
                <h1>Gram Altın (GAU/TRY)</h1>
                <span class="badge" id="status-badge">Canlı</span>
            </div>
            
            <div class="grid">
                <div class="box">
                    <span>Alış</span>
                    <strong id="alis">6250.00 ₺</strong>
                </div>
                <div class="box">
                    <span>Satış</span>
                    <strong id="satis">6270.00 ₺</strong>
                </div>
            </div>

            <div class="footer">
                <span id="degisim">Değişim: %--</span>
                <span id="zaman">Yükleniyor...</span>
            </div>
        </div>

        <!-- Temiz, Butonsuz Grafik Kartı -->
        <div class="chart-card">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                {
                  "autosize": true,
                  "symbol": "FX_IDC:XAUTRY",
                  "interval": "D",
                  "timezone": "Europe/Istanbul",
                  "theme": "dark",
                  "style": "1",
                  "locale": "tr",
                  "hide_top_toolbar": true,
                  "hide_legend": false,
                  "save_image": false,
                  "calendar": false,
                  "hide_volume": true,
                  "support_host": "https://www.tradingview.com"
                }
                </script>
            </div>
        </div>
    </div>

    <script>
        async function fetchGoldData() {
            try {
                let response = await fetch('/api/gold');
                let result = await response.json();
                
                if (result.success && result.data) {
                    let d = result.data;
                    document.getElementById('alis').innerText = d.alis + ' ₺';
                    document.getElementById('satis').innerText = d.satis + ' ₺';
                    document.getElementById('degisim').innerText = 'Değişim: ' + (d.degisim.startsWith('%') ? d.degisim : '%' + d.degisim);
                    document.getElementById('zaman').innerText = d.guncelleme || 'Canlı';
                }
            } catch (err) {
                console.error("Hata:", err);
            }
        }

        fetchGoldData();
        setInterval(fetchGoldData, 10000);
    </script>
</body>
</html>
