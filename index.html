<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gram Altın Takip Paneli</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; text-align: center; margin: 0; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 20px; width: 90%; max-width: 600px; }
        .price { font-size: 28px; font-weight: bold; color: #4caf50; }
        .buttons { margin: 15px 0; }
        button { background: #333; color: #fff; border: 1px solid #555; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin: 0 5px; font-weight: bold; }
        button.active { background: #4caf50; border-color: #4caf50; }
        canvas { background: #181818; border-radius: 5px; padding: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Gram Gold (GAU/TRY) Takip</h2>
        <div id="source" style="font-size: 12px; color: #888;">Kaynak: Bekleniyor...</div>
        <div class="price" id="alis-fiyat">0.00 TL</div>
        <div>Satış: <span id="satis-fiyat">0.00 TL</span> | Değişim: <span id="degisim">0%</span></div>
        <div style="font-size: 11px; color: #aaa; margin-top: 5px;" id="guncelleme">Son Güncelleme: --:--:--</div>

        <div class="buttons">
            <button class="active" onclick="changeTimeframe('1S', this)">1 Saat</button>
            <button onclick="changeTimeframe('1G', this)">1 Gün</button>
            <button onclick="changeTimeframe('1H', this)">1 Hafta</button>
        </div>

        <canvas id="goldChart" width="400" height="200"></canvas>
    </div>

    <script>
        let currentTimeframe = '1S';
        let chart;

        // LocalStorage'dan geçmiş verileri al veya boş başlat
        function getStoredHistory() {
            let data = localStorage.getItem('gold_history');
            return data ? JSON.parse(data) : { '1S': [], '1G': [], '1H': [] };
        }

        // Geçmiş verileri LocalStorage'a kaydet
        function saveStoredHistory(history) {
            localStorage.setItem('gold_history', JSON.stringify(history));
        }

        const ctx = document.getElementById('goldChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Gram Altın (TL)',
                    data: [],
                    borderColor: '#4caf50',
                    borderWidth: 2,
                    pointRadius: 2,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    x: { ticks: { color: '#aaa' }, grid: { color: '#222' } },
                    y: { ticks: { color: '#aaa' }, grid: { color: '#222' } }
                }
            }
        });

        function updateChartData() {
            let history = getStoredHistory();
            let prices = history[currentTimeframe] || [];
            
            chart.data.labels = prices.map((_, index) => index + 1);
            chart.data.datasets[0].data = prices;
            chart.update();
        }

        function changeTimeframe(tf, btn) {
            currentTimeframe = tf;
            document.querySelectorAll('.buttons button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateChartData();
        }

        function fetchData() {
            fetch('/api/gold')
                .then(response => response.json())
                .then(result => {
                    if(result.success) {
                        document.getElementById('source').innerText = "Kaynak: " + result.source;
                        document.getElementById('alis-fiyat').innerText = result.data.alis + " TL";
                        document.getElementById('satis-fiyat').innerText = result.data.satis + " TL";
                        document.getElementById('degisim').innerText = result.data.degisim;
                        document.getElementById('guncelleme').innerText = "Son Güncelleme: " + result.data.guncelleme;

                        let currentPrice = parseFloat(result.data.alis);
                        let history = getStoredHistory();

                        // Seçili zaman dilimleri için son fiyatı ekle (aynı değilse)
                        ['1S', '1G', '1H'].forEach(tf => {
                            if (!history[tf]) history[tf] = [];
                            let lastPrice = history[tf][history[tf].length - 1];
                            
                            if (lastPrice !== currentPrice) {
                                history[tf].push(currentPrice);
                                // Maksimum kayıt sınırları (örneğin her zaman dilimi için son 50 veri)
                                if (history[tf].length > 50) history[tf].shift();
                            }
                        });

                        saveStoredHistory(history);
                        updateChartData();
                    }
                })
                .catch(err => console.error("Veri çekme hatası:", err));
        }

        // Sayfa açıldığında ve her 10 saniyede bir veriyi güncelle
        fetchData();
        setInterval(fetchData, 10000);
        updateChartData();
    </script>
</body>
</html>
