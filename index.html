<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gram Altın (GAU/TRY) Canlı Takip</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; padding: 10px; min-height: 100vh; width: 100vw; overflow-x: hidden; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
        
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h1 { font-size: 16px; color: #f0b429; font-weight: 600; }
        .badge { background-color: #238636; color: white; padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .box { background-color: #21262d; border: 1px solid #30363d; border-radius: 10px; padding: 10px; text-align: center; transition: background 0.3s; }
        .box span { display: block; font-size: 11px; color: #8b949e; margin-bottom: 3px; }
        .box strong { font-size: 18px; color: #ffffff; letter-spacing: 0.5px; }
        
        .footer { display: flex; justify-content: space-between; font-size: 11px; color: #8b949e; border-top: 1px solid #30363d; padding-top: 8px; }
        
        .chart-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 14px; overflow: hidden; padding: 8px; height: 350px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .tradingview-widget-container { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Fiyat Kartı -->
        <div class="card">
            <div class="header">
                <h1>Gram Altın (GAU/TRY)</h1>
                <span class="badge" id="status-badge">Canlı</span>
            </div>
            
            <div class="grid">
                <div class="box" id="box-alis">
                    <span>Alış</span>
                    <strong id="alis">Yükleniyor...</strong>
                </div>
                <div class="box" id="box-satis">
                    <span>Satış</span>
                    <strong id="satis">Yükleniyor...</strong>
                </div>
            </div>

            <div class="footer">
                <span id="degisim">Değişim: %--</span>
                <span id="zaman">Güncelleniyor...</span>
            </div>
        </div>

        <!-- Doğru Fiyatlı Grafik Kartı -->
        <div class="chart-card">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                {
                  "autosize": true,
                  "symbol": "OANDA:XAUTRY",
                  "interval": "D",
                  "timezone": "Europe/Istanbul",
                  "theme": "dark",
                  "style": "1",
                  "locale": "tr",
                  "hide_top_toolbar": true,
                  "hide_legend": false,
                  "save_image": false,
                  "calendar": false,
                  "hide_volume": true,
                  "support_host": "https://www.tradingview.com"
                }
                </script>
            </div>
        </div>
    </div>

    <script>
        let lastAlis = 0;

        async function fetchGoldData() {
            try {
                let response = await fetch('/api/gold');
                let result = await response.json();
                
                if (result.success && result.data) {
                    let d = result.data;
                    let alisNum = parseFloat(d.alis);
                    
                    document.getElementById('alis').innerText = d.alis + ' ₺';
                    document.getElementById('satis').innerText = d.satis + ' ₺';
                    document.getElementById('degisim').innerText = 'Değişim: ' + (d.degisim.startsWith('%') ? d.degisim : '%' + d.degisim);
                    document.getElementById('zaman').innerText = d.guncelleme || 'Canlı Akış';
                    
                    let badge = document.getElementById('status-badge');
                    badge.innerText = result.source || 'Canlı';

                    let boxAlis = document.getElementById('box-alis');
                    if (lastAlis > 0 && alisNum !== lastAlis) {
                        boxAlis.style.backgroundColor = alisNum > lastAlis ? '#1b4725' : '#471b1b';
                        setTimeout(() => { boxAlis.style.backgroundColor = '#21262d'; }, 500);
                    }
                    lastAlis = alisNum;
                }
            } catch (err) {
                console.error("Hata:", err);
            }
        }

        fetchGoldData();
        setInterval(fetchGoldData, 1500);
    </script>
</body>
</html>
