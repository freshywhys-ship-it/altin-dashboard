<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gram Altın Canlı İzleyici</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0b0b;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: linear-gradient(145deg, #121212 0%, #1a1a1a 100%);
            border-radius: 32px;
            padding: 24px 20px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            border: 1px solid #2a2a2a;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f5c542;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(245, 197, 66, 0.15);
        }
        .header h1 i {
            margin-right: 8px;
            color: #f5c542;
        }
        .clock {
            font-size: 1.1rem;
            background: #1f1f1f;
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid #333;
            color: #b0b0b0;
            font-variant-numeric: tabular-nums;
        }
        .clock i {
            margin-right: 6px;
            color: #f5c542;
        }
        .price-box {
            text-align: center;
            padding: 20px 0 8px;
        }
        .price {
            font-size: 4.2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            transition: transform 0.15s ease;
            display: inline-block;
        }
        .price.animate {
            animation: pulse 0.5s ease;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            40% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .price .currency {
            font-size: 2rem;
            color: #f5c542;
            margin-left: 6px;
        }
        .change {
            font-size: 1.8rem;
            font-weight: 500;
            margin-top: 4px;
        }
        .change.positive { color: #4ade80; }
        .change.negative { color: #f87171; }
        .change i { margin-right: 6px; }
        .update-time {
            font-size: 0.9rem;
            color: #888;
            margin-top: 2px;
        }
        .update-time i {
            margin-right: 4px;
            color: #f5c542;
        }
        .chart-wrapper {
            margin: 18px 0 12px;
            background: #0f0f0f;
            border-radius: 20px;
            padding: 12px 8px 4px;
            border: 1px solid #262626;
        }
        canvas {
            width: 100% !important;
            height: auto !important;
            max-height: 260px;
        }
        .footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            font-size: 0.85rem;
            color: #777;
            border-top: 1px solid #222;
            padding-top: 14px;
        }
        .footer .son-degisimler {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .footer .son-degisimler span {
            background: #1a1a1a;
            padding: 2px 10px;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
            font-size: 0.8rem;
        }
        .footer .son-degisimler .up { color: #4ade80; }
        .footer .son-degisimler .down { color: #f87171; }
        .footer .render-badge {
            color: #555;
            font-size: 0.75rem;
            letter-spacing: 0.3px;
        }
        .footer .render-badge i {
            color: #f5c542;
            margin-right: 4px;
        }
        .status-msg {
            color: #f5c542;
            font-size: 0.9rem;
            margin-top: 6px;
        }
        @media (max-width: 640px) {
            .container { padding: 16px; }
            .header h1 { font-size: 1.2rem; }
            .price { font-size: 2.8rem; }
            .price .currency { font-size: 1.4rem; }
            .change { font-size: 1.4rem; }
            .footer { flex-direction: column; align-items: flex-start; }
            .chart-wrapper { padding: 8px 4px; }
        }
        @media (max-width: 480px) {
            .price { font-size: 2.2rem; }
            .header h1 { font-size: 1.0rem; }
            .clock { font-size: 0.9rem; padding: 4px 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-bolt"></i> Gram Altın Canlı İzleyici</h1>
        <div class="clock" id="clock"><i class="far fa-clock"></i> <span id="clockText">--:--:--</span></div>
    </div>

    <div class="price-box">
        <div class="price" id="priceDisplay">
            <span id="priceValue">--</span><span class="currency">₺</span>
        </div>
        <div class="change" id="changeDisplay">
            <i class="fas fa-arrow-up"></i> <span id="changeValue">+0.00%</span>
        </div>
        <div class="update-time">
            <i class="fas fa-sync-alt fa-fw fa-xs"></i> Son güncelleme: <span id="updateTime">--:--:--</span>
        </div>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="chart-wrapper">
        <canvas id="altinChart"></canvas>
    </div>

    <div class="footer">
        <div class="son-degisimler" id="sonDegisimler">
            <span>Son 10:</span>
        </div>
        <div class="render-badge">
            <i class="fas fa-cloud-upload-alt"></i> Render.com üzerinde çalışıyor
        </div>
    </div>
</div>

<script>
    (function() {
        const MAX_VERI = 500;
        let veriler = [];
        let chart = null;
        let sonFiyat = null;
        let denemeSayisi = 0;
        let intervalId = null;
        let isFetching = false;

        const chartCanvas = document.getElementById('altinChart');
        const priceValue = document.getElementById('priceValue');
        const changeDisplay = document.getElementById('changeDisplay');
        const updateTime = document.getElementById('updateTime');
        const clockText = document.getElementById('clockText');
        const statusMsg = document.getElementById('statusMsg');
        const priceDisplay = document.getElementById('priceDisplay');
        const sonDegisimler = document.getElementById('sonDegisimler');

        function updateClock() {
            const now = new Date();
            clockText.textContent = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        updateClock();
        setInterval(updateClock, 1000);

        function initChart(data) {
            const ctx = chartCanvas.getContext('2d');
            if (chart) chart.destroy();

            const labels = data.map(d => new Date(d.zaman).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }));
            const fiyatlar = data.map(d => d.fiyat);

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Gram Altın (₺)',
                        data: fiyatlar,
                        borderColor: '#f5c542',
                        backgroundColor: 'rgba(245, 197, 66, 0.08)',
                        borderWidth: 2.5,
                        pointRadius: 2,
                        pointBackgroundColor: fiyatlar.map((_, i) => i === fiyatlar.length - 1 ? '#4ade80' : '#f5c542'),
                        pointBorderColor: fiyatlar.map((_, i) => i === fiyatlar.length - 1 ? '#4ade80' : '#f5c542'),
                        pointHoverRadius: 6,
                        tension: 0.2,
                        fill: true,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y.toFixed(2) + ' ₺';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false },
                            ticks: { color: '#888', maxTicksLimit: 12, autoSkip: true },
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.06)', drawBorder: false },
                            ticks: { color: '#888', callback: function(value) { return value.toFixed(0); } },
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                }
            });
        }

        function updateChart() {
            if (!veriler.length) return;
            const son = veriler.slice(-MAX_VERI);
            const labels = son.map(d => new Date(d.zaman).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }));
            const fiyatlar = son.map(d => d.fiyat);

            if (chart) {
                chart.data.labels = labels;
                chart.data.datasets[0].data = fiyatlar;
                chart.data.datasets[0].pointBackgroundColor = fiyatlar.map((_, i) => i === fiyatlar.length - 1 ? '#4ade80' : '#f5c542');
                chart.data.datasets[0].pointBorderColor = fiyatlar.map((_, i) => i === fiyatlar.length - 1 ? '#4ade80' : '#f5c542');
                chart.update('none');
            } else {
                initChart(son);
            }
        }

        function updatePriceDisplay(fiyat, degisim, guncelleme) {
            if (fiyat !== null && fiyat !== undefined && !isNaN(fiyat)) {
                sonFiyat = fiyat;
                priceValue.textContent = fiyat.toFixed(2);
                priceDisplay.classList.remove('animate');
                void priceDisplay.offsetWidth;
                priceDisplay.classList.add('animate');
            } else {
                priceValue.textContent = '--';
            }

            if (degisim !== null && degisim !== undefined && !isNaN(degisim)) {
                const sign = degisim >= 0 ? '+' : '';
                const cls = degisim >= 0 ? 'positive' : 'negative';
                const arrow = degisim >= 0 ? 'fa-arrow-up' : 'fa-arrow-down';
                changeDisplay.className = 'change ' + cls;
                changeDisplay.innerHTML = `<i class="fas ${arrow}"></i> <span id="changeValue">${sign}${degisim.toFixed(2)}%</span>`;
            } else {
                changeDisplay.className = 'change';
                changeDisplay.innerHTML = `<i class="fas fa-minus"></i> <span id="changeValue">--%</span>`;
            }

            if (guncelleme) {
                const parts = guncelleme.split(' ');
                const timePart = parts.length > 1 ? parts[1] : guncelleme;
                updateTime.textContent = timePart || '--:--:--';
            } else {
                updateTime.textContent = '--:--:--';
            }
        }

        function updateSonDegisimler() {
            const son = veriler.slice(-10);
            let html = '<span>Son 10:</span>';
            if (son.length < 2) {
                html += '<span>Yeterli veri yok</span>';
            } else {
                for (let i = 1; i < son.length; i++) {
                    const onceki = son[i-1].fiyat;
                    const simdi = son[i].fiyat;
                    if (onceki && simdi) {
                        const deg = ((simdi - onceki) / onceki * 100);
                        const cls = deg >= 0 ? 'up' : 'down';
                        const arrow = deg >= 0 ? '↑' : '↓';
                        html += `<span class="${cls}">${arrow} ${Math.abs(deg).toFixed(2)}%</span>`;
                    }
                }
            }
            sonDegisimler.innerHTML = html;
        }

        function loadFromStorage() {
            try {
                const stored = localStorage.getItem('altinVerileri');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length) {
                        veriler = parsed.slice(-MAX_VERI);
                        return true;
                    }
                }
            } catch (e) { /* ignore */ }
            return false;
        }

        function saveToStorage() {
            try {
                localStorage.setItem('altinVerileri', JSON.stringify(veriler.slice(-MAX_VERI)));
            } catch (e) { /* ignore */ }
        }

        async function fetchPrice() {
            if (isFetching) return;
            isFetching = true;
            try {
                const resp = await fetch('/api/altin');
                const data = await resp.json();
                if (data.fiyat !== null && data.fiyat !== undefined && !isNaN(data.fiyat)) {
                    denemeSayisi = 0;
                    statusMsg.textContent = '';
                    const yeni = {
                        zaman: new Date().toISOString(),
                        fiyat: data.fiyat
                    };
                    veriler.push(yeni);
                    if (veriler.length > MAX_VERI) veriler.shift();
                    saveToStorage();
                    updateChart();
                    updatePriceDisplay(data.fiyat, data.degisim, data.guncelleme);
                    updateSonDegisimler();
                } else {
                    handleError('Veri alınamadı');
                }
            } catch (err) {
                handleError('Bağlantı hatası');
            }
            isFetching = false;
        }

        function handleError(msg) {
            denemeSayisi++;
            if (denemeSayisi < 3) {
                statusMsg.textContent = `Bağlantı bekleniyor... (${denemeSayisi}/3)`;
                setTimeout(() => { fetchPrice(); }, 2000);
            } else {
                statusMsg.textContent = 'Bağlantı bekleniyor... (10s sonra yeniden)';
                denemeSayisi = 0;
                setTimeout(() => { fetchPrice(); }, 10000);
            }
        }

        function init() {
            const hasStorage = loadFromStorage();
            if (hasStorage && veriler.length) {
                updateChart();
                const son = veriler[veriler.length - 1];
                updatePriceDisplay(son.fiyat, null, null);
                updateSonDegisimler();
            }

            fetch('/api/gecmis')
                .then(r => r.json())
                .then(data => {
                    if (Array.isArray(data) && data.length) {
                        const mevcutZamanlar = new Set(veriler.map(d => d.zaman));
                        const yeniVeriler = data.filter(d => !mevcutZamanlar.has(d.zaman));
                        if (yeniVeriler.length) {
                            veriler = veriler.concat(yeniVeriler);
                            veriler.sort((a,b) => new Date(a.zaman) - new Date(b.zaman));
                            if (veriler.length > MAX_VERI) veriler = veriler.slice(-MAX_VERI);
                            saveToStorage();
                            updateChart();
                            const son = veriler[veriler.length - 1];
                            updatePriceDisplay(son.fiyat, null, null);
                            updateSonDegisimler();
                        }
                    }
                })
                .catch(() => {});

            intervalId = setInterval(() => {
                fetchPrice();
            }, 5000);

            fetchPrice();
        }

        init();

        window.addEventListener('beforeunload', function() {
            if (intervalId) clearInterval(intervalId);
        });
    })();
</script>
</body>
</html>
