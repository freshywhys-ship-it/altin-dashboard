<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gram Altın (GAU/TRY) Canlı Takip</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; padding: 10px; min-height: 100vh; width: 100vw; overflow-x: hidden; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
        
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h1 { font-size: 16px; color: #f0b429; font-weight: 600; }
        .badge { background-color: #238636; color: white; padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .box { background-color: #21262d; border: 1px solid #30363d; border-radius: 10px; padding: 10px; text-align: center; transition: background 0.3s; }
        .box span { display: block; font-size: 11px; color: #8b949e; margin-bottom: 3px; }
        .box strong { font-size: 18px; color: #ffffff; letter-spacing: 0.5px; }
        
        .footer { display: flex; justify-content: space-between; font-size: 11px; color: #8b949e; border-top: 1px solid #30363d; padding-top: 8px; }
        
        .chart-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 14px; overflow: hidden; padding: 14px; height: 340px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: space-between; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #8b949e; margin-bottom: 8px; }
        .chart-header strong { color: #f0b429; font-size: 14px; }
        canvas { width: 100%; height: 230px; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Fiyat Kartı -->
        <div class="card">
            <div class="header">
                <h1>Gram Altın (GAU/TRY)</h1>
                <span class="badge" id="status-badge">Canlı</span>
            </div>
            
            <div class="grid">
                <div class="box" id="box-alis">
                    <span>Alış</span>
                    <strong id="alis">Yükleniyor...</strong>
                </div>
                <div class="box" id="box-satis">
                    <span>Satış</span>
                    <strong id="satis">Yükleniyor...</strong>
                </div>
            </div>

            <div class="footer">
                <span id="degisim">Değişim: %--</span>
                <span id="zaman">Güncelleniyor...</span>
            </div>
        </div>

        <!-- Canlı Grafik -->
        <div class="chart-card">
            <div class="chart-header">
                <span>Canlı Fiyat Grafiği</span>
                <strong id="chart-current-price">-- ₺</strong>
            </div>
            <canvas id="goldChart"></canvas>
            <div style="display: flex; justify-content: space-between; font-size: 10px; color: #8b949e; margin-top: 6px;">
                <span>Anlık Akış</span>
                <span style="color: #238636; font-weight: 600;">● Kesintisiz Senkronize</span>
            </div>
        </div>
    </div>

    <script>
        let lastAlis = 0;
        let priceHistory = [];

        const canvas = document.getElementById('goldChart');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth - 28;
            canvas.height = 220;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (priceHistory.length < 2) return;

            let min = Math.min(...priceHistory);
            let max = Math.max(...priceHistory);
            if (min === max) { min -= 2; max += 2; }

            let padding = 25;
            let w = canvas.width;
            let h = canvas.height;
            let step = w / (priceHistory.length - 1);

            ctx.beginPath();
            ctx.strokeStyle = '#f0b429';
            ctx.lineWidth = 2.5;

            let points = [];
            for (let i = 0; i < priceHistory.length; i++) {
                let x = i * step;
                let y = h - padding - ((priceHistory[i] - min) / (max - min)) * (h - padding * 2);
                points.push({x, y});
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            let lastX = points[points.length - 1].x;
            ctx.lineTo(lastX, h);
            ctx.lineTo(0, h);
            ctx.closePath();
            
            let gradient = ctx.createLinearGradient(0, 0, 0, h);
            gradient.addColorStop(0, 'rgba(240, 180, 41, 0.3)');
            gradient.addColorStop(1, 'rgba(240, 180, 41, 0.0)');
            ctx.fillStyle = gradient;
            ctx.fill();

            let lastPoint = points[points.length - 1];
            ctx.beginPath();
            ctx.arc(lastPoint.x, lastPoint.y, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = '#f0b429';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        async function fetchGoldData() {
            try {
                let response = await fetch('/api/gold');
                let result = await response.json();
                
                if (result.success && result.data) {
                    let d = result.data;
                    let alisNum = parseFloat(d.alis);
                    
                    document.getElementById('alis').innerText = d.alis + ' ₺';
                    document.getElementById('satis').innerText = d.satis + ' ₺';
                    document.getElementById('degisim').innerText = 'Değişim: ' + (d.degisim.startsWith('%') ? d.degisim : '%' + d.degisim);
                    document.getElementById('zaman').innerText = d.guncelleme || 'Canlı Akış';
                    document.getElementById('chart-current-price').innerText = d.alis + ' ₺';

                    let badge = document.getElementById('status-badge');
                    badge.innerText = result.source || 'Canlı';

                    let boxAlis = document.getElementById('box-alis');
                    if (lastAlis > 0 && alisNum !== lastAlis) {
                        boxAlis.style.backgroundColor = alisNum > lastAlis ? '#1b4725' : '#471b1b';
                        setTimeout(() => { boxAlis.style.backgroundColor = '#21262d'; }, 500);
                    }
                    lastAlis = alisNum;

                    if (priceHistory.length === 0) {
                        priceHistory = [alisNum - 1, alisNum - 0.5, alisNum - 0.8, alisNum];
                    } else {
                        if (priceHistory[priceHistory.length - 1] !== alisNum) {
                            priceHistory.push(alisNum);
                            if (priceHistory.length > 25) priceHistory.shift();
                        }
                    }
                    drawChart();
                }
            } catch (err) {
                console.error("Hata:", err);
            }
        }

        fetchGoldData();
        setInterval(fetchGoldData, 1500);
    </script>
</body>
</html>
