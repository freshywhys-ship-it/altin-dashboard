<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gram Altın Takip</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fbbf24;
        }

        .badge {
            background-color: #0284c7;
            color: #ffffff;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .price-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .price-box {
            background-color: #0f172a;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f1f5f9;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #334155;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .change {
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1 class="title">Gram Altın (GAU/TRY)</h1>
            <span class="badge" id="status">Canlı</span>
        </div>

        <div class="price-container">
            <div class="price-box">
                <div class="label">Alış</div>
                <div class="value" id="buy-price">--- ₺</div>
            </div>
            <div class="price-box">
                <div class="label">Satış</div>
                <div class="value" id="sell-price">--- ₺</div>
            </div>
        </div>

        <div class="info-row">
            <div>Değişim: <span class="change" id="change-rate">%0.00</span></div>
            <div id="update-time">Yükleniyor...</div>
        </div>
    </div>

    <script>
        async function fetchGoldData() {
            try {
                const response = await fetch('/api/gold');
                const result = await response.json();

                if (result.success) {
                    document.getElementById('buy-price').innerText = result.data.alis + ' ₺';
                    document.getElementById('sell-price').innerText = result.data.satis + ' ₺';
                    document.getElementById('change-rate').innerText = result.data.degisim;
                    document.getElementById('update-time').innerText = result.data.guncelleme || 'Güncellendi';
                } else {
                    document.getElementById('status').innerText = 'Hata';
                    document.getElementById('status').style.backgroundColor = '#ef4444';
                }
            } catch (error) {
                console.error('Veri çekme hatası:', error);
                document.getElementById('status').innerText = 'Bağlantı Yok';
                document.getElementById('status').style.backgroundColor = '#ef4444';
            }
        }

        // İlk yüklemede çalıştır
        fetchGoldData();

        // Her 10 saniyede bir otomatik yenile
        setInterval(fetchGoldData, 10000);
    </script>
</body>
</html>
